name: Report a text or liturgical error
description: Report an incorrect prayer, calendar entry, Bible passage, or reading.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the texts in Vigil. Please search existing issues first.
        Please remember that issues and discussions are public. Remove personal information from screenshots and logs before sharing.
  - type: textarea
    id: location
    attributes:
      label: Where did you find the error?
      description: For prayers, include date (YYYY-MM-DD), hour, language, and calendar or rubrics if available. For readings, include the work or translation and passage or section.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What does Vigil show?
      description: Describe the problem or paste a short relevant excerpt.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it show?
      description: Explain the expected text or observance. If you are unsure, describe the concern.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Reference or screenshot (optional)
      description: Link to a source or provide its title and page. A reference is helpful but not required.
  - type: input
    id: environment
    attributes:
      label: Vigil version, device, and operating system
      description: Include what you know; enter unknown for anything unavailable.
    validations:
      required: true
